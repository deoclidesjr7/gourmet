async function carregarDados() {
  const { data, error } = await sb.from('gourmet_data').select('key,value');

  });
}

const normTxt = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
// procura o frete cadastrado para uma cidade + bairro (devolve o item ou null)
function buscarFrete(cidade, bairro) {
  const c = normTxt(cidade), b = normTxt(bairro);
  if (!c || !b) return null;
  return fretes.find(x => normTxt(x.cidade) === c && normTxt(x.bairro) === b) || null;
}
// lê cidade e bairro direto do texto do endereço (ex.: "Rua X, 10 - compl - Bairro, Cidade - SC")
function buscarFretePeloTexto(texto) {
  const t = normTxt(texto);
  if (!t) return null;
  let cidade = null, pos = -1;
  CIDADES_ENTREGA.forEach(c => {
    const k = normTxt(c), i = t.lastIndexOf(k);
    if (i > pos || (i === pos && cidade && k.length > normTxt(cidade).length)) { pos = i; cidade = c; }
  });
  if (!cidade || pos < 0) return null;
  const candidatos = fretes.filter(f => normTxt(f.cidade) === normTxt(cidade));
  if (!candidatos.length) return null;
  const segs = t.slice(0, pos).split(/\s-\s|,/).map(x => x.trim()).filter(Boolean);
  for (let k = segs.length - 1; k >= 0; k--) {          // 1) o trecho é exatamente o bairro
    const f = candidatos.find(x => normTxt(x.bairro) === segs[k]);
    if (f) return f;
  }
  const resto = segs.slice(1).join(' | ');                // 2) bairro citado no meio (sem contar o nome da rua)
  const ordenados = [...candidatos].sort((a, b) => normTxt(b.bairro).length - normTxt(a.bairro).length);
  return ordenados.find(f => {
    const b = normTxt(f.bairro).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return b && new RegExp('(^|[^a-z0-9])' + b + '([^a-z0-9]|$)').test(resto);
  }) || null;
}
// o que vale é o endereço que será enviado; se ele não revelar o bairro, usa os campos cidade/bairro
function acharFrete(texto, cidade, bairro) {
  return buscarFretePeloTexto(texto) || buscarFrete(cidade, bairro);
}
function freteDe(cidade, bairro) {
  const f = buscarFrete(cidade, bairro);
  return f ? (Number(f.valor) || 0) : null;
}
const ehRetirada = p => (p.itens || []).some(l => /^retirada no local/i.test(String(l)));
const freteDoPedido = p => {

    if (m) return Number(m[1].replace(/\./g, '').replace(',', '.')) || 0;
  }
  return 0;
};
function fmtZap(w) {
  let d = String(w || '').replace(/\D/g, '');
  if (d.startsWith('55') && d.length >= 12) d = d.slice(2);
  if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return d;
}

let atualizando = false;
async function atualizarVivo() {
  if (atualizando || document.hidden || location.hash === '#admin') return;
  atualizando = true;
  try {
    const { data, error } = await sb.from('gourmet_data').select('key,value');
    if (error || !data) return;
    let novaConfig = config, novosProdutos = produtos, novosFretes = fretes;
    data.forEach(r => {
      if (r.key === 'config') novaConfig = { ...CONFIG_PADRAO, ...r.value };
      if (r.key === 'produtos') novosProdutos = Array.isArray(r.value) ? r.value : [];
      if (r.key === 'fretes') novosFretes = Array.isArray(r.value) ? r.value : [];
    });
    const configMudou = JSON.stringify(novaConfig) !== JSON.stringify(config);
    const produtosMudou = JSON.stringify(novosProdutos) !== JSON.stringify(produtos);
    const fretesMudou = JSON.stringify(novosFretes) !== JSON.stringify(fretes);
    if (!configMudou && !produtosMudou && !fretesMudou) return;
    config = novaConfig; produtos = novosProdutos; fretes = novosFretes;
    if ($('c-resumo')) atualizarResumo();                 // checkout aberto: recalcula o frete

    } else if (configMudou && !$('modal').innerHTML.trim() && location.hash === '') {
      render();                                           // tela inicial sem nada aberto: aplica a nova aparência
    }
  } catch (e) { console.warn(e); } finally { atualizando = false; }
}

// ao vivo: assim que o admin salva algo, o site de quem está olhando atualiza na hora
let canalDados = null, timerDados = null, tentativasDados = 0;
function ligarDadosAoVivo() {
  if (canalDados) return;
  canalDados = sb.channel('dados-site')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gourmet_data' }, () => {
      clearTimeout(timerDados);
      timerDados = setTimeout(atualizarVivo, 300);
    })
    .subscribe(st => {
      if (st === 'SUBSCRIBED') tentativasDados = 0;
      if ((st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') && tentativasDados < 3) {
        tentativasDados++;
        try { sb.removeChannel(canalDados); } catch (e) {}
        canalDados = null;
        setTimeout(ligarDadosAoVivo, 5000);
      }
    });
}

const LOGO_V = 4;   // mude este número quando trocar o arquivo da logo, para o navegador baixar a nova

async function salvarNovaSenha() {
  const a = $('n-senha').value, b = $('n-senha2').value;
  if (a.length < 6) { $('n-erro').textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
  if (a !== b) { $('n-erro').textContent = 'As duas senhas não são iguais.'; return; }
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) { $('n-erro').textContent = traduzErro(error); return; }
  const { data } = await sb.auth.getSession();
  sessao = data.session;
  iniciarAvisosCliente();
  modal(`
    <h2 class="serif text-3xl mb-3">Senha alterada!</h2>
    <p class="text-white/70">Sua senha nova já está valendo e você já está dentro da sua conta.</p>
    <button class="btn mt-5" data-act="fechar">Entendi</button>`);
  render();
}

function traduzErro(e) {
  const m = (e?.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'E-mail ou senha incorretos.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'Já existe uma conta com este e-mail. Use "Entrar".';
  if (m.includes('email not confirmed')) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if (m.includes('different from the old')) return 'Escolha uma senha diferente da anterior.';
  if (m.includes('password')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas. Aguarde alguns minutos.';
  return 'Não foi possível concluir. Tente novamente.';
}

async function entrarCliente() {
  const email = tira($('u-email').value);
  const senha = $('u-senha').value;
  if (!email || !senha) { $('u-erro').textContent = 'Informe e-mail e senha.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) { $('u-erro').textContent = traduzErro(error); return; }
  sessao = data.session;
  concluirLogin();
}

async function cadastrarCliente() {
  const nome = tira($('u-nome').value);
  const whats = tira($('u-whats').value).replace(/\D/g, '');
  const email = tira($('u-email').value);
  const senha = $('u-senha').value;
  if (!nome || !whats || !email || senha.length < 6) {
    $('u-erro').textContent = 'Preencha nome, WhatsApp, e-mail e uma senha com pelo menos 6 caracteres.';
    return;
  }
  const { data, error } = await sb.auth.signUp({
    email,
    password: senha,
    options: { data: { nome, whatsapp: whats }, emailRedirectTo: location.origin + location.pathname }
  });
  if (error) { $('u-erro').textContent = traduzErro(error); return; }

  if (data.session) {
    sessao = data.session;
    concluirLogin();
    return;
  }
  modal(`
    <h2 class="serif text-3xl mb-3">Quase lá!</h2>
    <p class="text-white/70">Enviamos um link de confirmação para <b>${esc(email)}</b>. Clique nele para ativar sua conta e depois entre no site.</p>
    <button class="btn mt-5" data-act="fechar">Entendi</button>`);
}

function concluirLogin() {
  fecharModal();
  const depois = pendingAfterLogin;
  pendingAfterLogin = null;
  render();
  iniciarAvisosCliente();
  religarPush();
  if (depois) depois();
}

async function sair() {
  pararAvisosCliente();
  await soltarPush();
  await sb.auth.signOut();
  sessao = null;
  if (canal) { sb.removeChannel(canal); canal = null; }
  location.hash = '';
  render();
}

/* ---------- área do cliente: meus pedidos ---------- */
async function renderConta() {

    $('app').innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-6 text-center">

        <h1 class="serif text-4xl mb-3">Minha conta</h1>
        <p class="text-white/70 mb-5">Entre para ver seus pedidos.</p>
        <div class="flex gap-3 justify-center flex-wrap">
          <button class="btn" data-act="login-abrir">Entrar</button>
          <button class="btn2" data-act="cadastro-abrir">Criar conta</button>
          <a class="btn2" href="#">Voltar ao site</a>
        </div>
      </div>
    </div>`;
    return;
  }

  $('app').innerHTML = `
  <div class="min-h-screen p-5 max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
      <h1 class="serif text-4xl">Olá, ${esc(nomeCliente())}</h1>
      <div class="flex gap-2 flex-wrap">
        <button class="btn2" data-act="suporte">Suporte</button>
        <button class="btn2" data-act="push-ativar">Ativar avisos de pedido</button>

}

const fmtHora = d => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtDataHora = d => new Date(d).toLocaleDateString('pt-BR') + ' às ' + fmtHora(d);

// linha com o horário de cada etapa do pedido (usa status_atualizado_em, preenchido pelo banco)
function linhaHorario(p) {
  const quando = p.status_atualizado_em || (p.status === 'novo' ? p.created_at : null);
  if (!quando) return '';
  const rotulo = { novo: 'Pedido recebido às', preparando: 'Em preparo desde as', entregando: 'Saiu para entrega às', entregue: 'Entregue em', cancelado: 'Cancelado em' }[p.status];
  if (!rotulo) return '';
  const txt = (p.status === 'entregue' || p.status === 'cancelado') ? fmtDataHora(quando) : fmtHora(quando);
  return `<p class="text-sm mt-1 ${p.status === 'entregue' ? 'text-emerald-300' : 'text-white/70'}">${rotulo} ${txt}</p>`;
}

// atualiza só a lista de pedidos (sem piscar a tela nem perder a posição da rolagem)
async function atualizarMeusPedidos() {
  if (!sessao || !$('meus')) return;
  const { data, error } = await sb.from('gourmet_pedidos')
    .select('*')
    .eq('user_id', sessao.user.id)
    .order('created_at', { ascending: false });
  if (!$('meus')) return;   // o cliente saiu da tela enquanto carregava

  if (error) {
    $('meus').innerHTML = `<p class="text-red-400">Erro ao carregar: ${esc(error.message)}</p>`;
    return;
  }
  meusPedidos = data || [];

  $('meus').innerHTML = meusPedidos.length ? meusPedidos.map(p => `
    <div class="glass rounded-xl p-4 mb-3">
      <div class="flex justify-between flex-wrap gap-2">
        <p class="font-semibold">${p.numero ? '<span class="text-lg">' + esc(numPedido(p.numero)) + '</span> · ' : ''}${new Date(p.created_at).toLocaleDateString('pt-BR')} às ${fmtHora(p.created_at)}</p>
        <p class="text-sm px-3 py-1 rounded-full bg-white/10">${esc(p.status)}</p>
      </div>
      ${linhaHorario(p)}
      <ul class="text-sm mt-2 list-disc list-inside text-white/80">${(p.itens || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      <p class="mt-2">Total: <b>${fmt(p.total)}</b> · ${esc(p.forma_pagamento)}</p>
      ${p.carrinho
        ? `<button class="btn mt-3" data-act="reorder" data-id="${esc(p.id)}">Pedir de novo</button>`
        : '<p class="text-white/50 text-xs mt-2">Pedidos feitos antes desta atualização não podem ser repetidos.</p>'}
      ${p.status === 'novo' ? `<button class="btn2 mt-3 ml-2" data-act="cancelar-meu" data-id="${esc(p.id)}">Cancelar pedido</button>` : ''}
    </div>`).join('')
    : '<p class="text-white/60">Você ainda não fez nenhum pedido.</p>';
}

async function cancelarMeuPedido(id) {
  if (!confirm('Deseja realmente cancelar este pedido?')) return;
  const { data, error } = await sb.rpc('cancelar_pedido', { p_id: String(id) });
  if (error || data === false) {
    alert('Não foi possível cancelar. O pedido pode já estar em preparo. Fale com a loja pelo WhatsApp.');
    return;
  }
  statusConhecido[id] = 'cancelado';
  renderConta();
}

/* ---------- avisos de status para o cliente ---------- */
let statusConhecido = {}, canalCliente = null, tentativasCliente = 0;
const ehClienteComum = () => !!sessao;   // vale para qualquer conta logada (só os pedidos da própria conta)

function mostrarAviso(texto) {
  let box = document.getElementById('aviso-status');
  if (box) box.remove();
  box = document.createElement('div');
  box.id = 'aviso-status';
  box.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[80] w-[92vw] max-w-md rounded-2xl p-4 bg-zinc-950 border border-white/20 shadow-lg text-center cursor-pointer';
  box.innerHTML = '<p class="font-semibold">' + esc(texto) + '</p><p class="text-xs text-white/50 mt-1">Toque para fechar</p>';
  box.onclick = () => box.remove();
  document.body.appendChild(box);
  setTimeout(() => { if (box.isConnected) box.remove(); }, 10000);
  try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
  tocarSuave();
}

function textoStatus(p) {
  const n = numPedido(p.numero);
  const nome = n ? 'Seu pedido ' + n : 'Seu pedido';
  if (p.status === 'preparando') return nome + ' está sendo preparado.';
  if (p.status === 'entregando') return nome + ' saiu para entrega. Já está a caminho!';
  if (p.status === 'entregue') return nome + ' foi entregue' + (p.status_atualizado_em ? ' às ' + fmtHora(p.status_atualizado_em) : '') + '. Bom apetite!';
  if (p.status === 'cancelado') return nome + ' foi cancelado.';
  return '';
}

function registrarStatus(p, silencioso) {
  if (!p || p.id === undefined) return;
  const antes = statusConhecido[p.id] ?? (silencioso ? p.status : 'novo');
  statusConhecido[p.id] = p.status;
  if (silencioso || antes === p.status) return;
  const txt = textoStatus(p);
  if (txt && location.hash !== '#admin') {
    mostrarAviso(txt);
    avisoDoNavegador(txt);
  }
  if (location.hash === '#conta') atualizarMeusPedidos();
}

// se a aba estiver em segundo plano, mostra também uma notificação do navegador (quando permitida)
function avisoDoNavegador(txt) {
  try {
    if (!document.hidden || !window.Notification || Notification.permission !== 'granted') return;
    navigator.serviceWorker.getRegistration('/').then(reg => {
      if (reg) reg.showNotification(NOME_LOJA, { body: txt, icon: '/favicon.png' });
      else new Notification(NOME_LOJA, { body: txt });
    }).catch(() => { try { new Notification(NOME_LOJA, { body: txt }); } catch (e) {} });
  } catch (e) { console.warn(e); }
}

async function carregarStatusCliente(primeira) {
  if (!ehClienteComum()) return;
  try {
    const { data, error } = await sb.from('gourmet_pedidos')
      .select('id,numero,status,status_atualizado_em').eq('user_id', sessao.user.id)
      .order('created_at', { ascending: false }).limit(50);
    if (error || !data) return;
    let apareceuPedido = false;
    data.forEach(p => {
      if (!primeira && statusConhecido[p.id] === undefined) apareceuPedido = true;
      registrarStatus(p, primeira);
    });
    if (apareceuPedido && location.hash === '#conta') atualizarMeusPedidos();
  } catch (e) { console.warn(e); }
}

async function iniciarAvisosCliente() {
  if (!ehClienteComum()) return;
  await carregarStatusCliente(true);
  if (canalCliente) return;
  canalCliente = sb.channel('cliente-pedidos-' + sessao.user.id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'gourmet_pedidos', filter: 'user_id=eq.' + sessao.user.id },
      payload => registrarStatus(payload.new, false))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'gourmet_pedidos', filter: 'user_id=eq.' + sessao.user.id },
      payload => {
        if (payload.new && payload.new.id !== undefined && statusConhecido[payload.new.id] === undefined) statusConhecido[payload.new.id] = payload.new.status;
        if (location.hash === '#conta') atualizarMeusPedidos();
      })
    .subscribe(st => {
      if (st === 'SUBSCRIBED') tentativasCliente = 0;
      if ((st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') && tentativasCliente < 3) {
        tentativasCliente++;
        try { sb.removeChannel(canalCliente); } catch (e) {}
        canalCliente = null;
        setTimeout(iniciarAvisosCliente, 5000);
      }
    });
}

function pararAvisosCliente() {
  if (canalCliente) { sb.removeChannel(canalCliente); canalCliente = null; }
  statusConhecido = {};
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) carregarStatusCliente(false); });
setInterval(() => { if (!document.hidden) carregarStatusCliente(false); }, 15000);

function abrirSuporte() {
  const nome = sessao && sessao.user && sessao.user.user_metadata && sessao.user.user_metadata.nome;
  const txt = '*' + NOME_LOJA + '*\nOlá! ' + (nome ? 'Sou ' + nome + ' e ' : '') + 'preciso de ajuda.';
  modal(`
    <h2 class="serif text-3xl mb-3">Suporte</h2>
    <p class="text-white/70">Ficou com alguma dúvida? Fale com a loja pelo WhatsApp:</p>
    <p class="text-2xl font-semibold mt-3">${esc(fmtZap(config.whatsapp))}</p>
    <div class="flex gap-3 mt-5 flex-wrap">
      <a class="btn" style="text-decoration:none;display:inline-block" href="https://wa.me/${esc(String(config.whatsapp).replace(/\D/g, ''))}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Chamar no WhatsApp</a>
      <button class="btn2" data-act="fechar">Fechar</button>
    </div>`);
}

function reorderPedido(id) {
  const p = meusPedidos.find(x => x.id === id);
  if (!p || !p.carrinho) return;

  const novo = [];
  let indisponiveis = 0;
  p.carrinho.forEach(c => {
    const prod = produtos.find(x => x.id === c.id && x.ativo !== false);
    if (prod) novo.push({ id: prod.id, nome: prod.nome, preco: Number(prod.preco) || 0, qtd: Math.max(1, Number(c.qtd) || 1) });
    else indisponiveis++;
  });

  if (!novo.length) {
    alert('Nenhum item deste pedido está disponível no momento.');
    return;
  }
  carrinho = novo;
  atualizarContador();
  if (indisponiveis) alert(indisponiveis + ' item(ns) deste pedido não está(ão) mais disponível(is) e foram removidos.');
  location.hash = '';
  render();
  abrirCarrinho();
}

/* ---------- catálogo e carrinho ---------- */
function abrirCatalogo(cat) {
  const catAtiva = cat || null;
  const lista = produtos.filter(p => p.ativo !== false && (!catAtiva || p.categoria === catAtiva));
  const tabs = ['Todos', ...config.abas];
  modal(`
    <div class="flex justify-between items-center mb-4 gap-2">
      <h2 class="serif text-3xl">Catálogo</h2>
      <button class="btn2" data-act="carrinho">Carrinho (${qtdCarrinho()})</button>
    </div>
    <div class="rolagem-fina flex gap-2 overflow-x-auto pb-2 mb-4">
      ${tabs.map(c => {
        const ativo = (c === 'Todos' && !catAtiva) || c === catAtiva;
        return `<button class="${ativo ? 'btn' : 'btn2'} whitespace-nowrap" data-act="catalogo" data-val="${c === 'Todos' ? '' : esc(c)}">${esc(c)}</button>`;
      }).join('')}
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      ${lista.length ? lista.map(p => `
        <button class="text-left glass rounded-xl overflow-hidden" data-act="ver" data-id="${esc(p.id)}">
          ${p.foto ? `<img loading="lazy" decoding="async" src="${esc(p.foto)}" class="w-full h-32 object-cover">` : '<div class="h-32 bg-white/10"></div>'}
          <div class="p-3"><p class="font-medium">${esc(p.nome)}</p><p class="text-white/70 text-sm">${fmt(p.preco)}</p></div>
        </button>`).join('')
        : '<p class="text-white/60 col-span-2 md:col-span-3">Nenhum produto nesta categoria ainda.</p>'}
    </div>`, true);
  modalTipo = 'catalogo'; modalCat = catAtiva;
}

function verProduto(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  modal(`
    ${p.foto ? `<img loading="lazy" decoding="async" src="${esc(p.foto)}" class="w-full h-64 object-cover rounded-xl mb-4">` : ''}
    <h2 class="serif text-3xl">${esc(p.nome)}</h2>
    <p class="text-white/70 mt-2">${esc(p.descricao)}</p>
    <p class="text-2xl font-semibold mt-4">${fmt(p.preco)}</p>
    <label>Quantidade</label>
    <input id="qtd-prod" type="number" min="1" value="1" inputmode="numeric" style="width:12.5%;min-width:56px;text-align:left;padding-left:10px !important;padding-right:2px !important">
    <div class="flex gap-3 mt-5 flex-wrap">
      <button class="btn" data-act="add" data-id="${esc(p.id)}">Adicionar ao pedido</button>
      <button class="btn2" data-act="catalogo">Voltar</button>
    </div>`);
}

function addCarrinho(id, qtd) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const q = Math.max(1, qtd || 1);
  const item = carrinho.find(i => i.id === id);
  if (item) item.qtd += q;
  else carrinho.push({ id: p.id, nome: p.nome, preco: Number(p.preco) || 0, qtd: q });
  abrirCarrinho();
}

function alterarQtd(id, delta) {
  const item = carrinho.find(i => i.id === id);
  if (item) item.qtd = Math.max(1, item.qtd + delta);
  abrirCarrinho();
}

function abrirCarrinho() {
  atualizarContador();
  if (!carrinho.length) {
    modal(`
      <h2 class="serif text-3xl mb-4">Carrinho</h2>
      <p class="text-white/70">Seu carrinho está vazio.</p>
      <button class="btn2 mt-4" data-act="catalogo">Ver catálogo</button>`);
    return;
  }
  modal(`
    <h2 class="serif text-3xl mb-4">Seu pedido</h2>
    ${carrinho.map(i => `
      <div class="flex justify-between items-center py-3 border-b border-white/10 gap-2">
        <div class="flex-1"><p>${esc(i.nome)}</p><p class="text-white/60 text-sm">${fmt(i.preco)} cada</p></div>
        <div class="flex items-center gap-2">
          <button class="btn2" data-act="qtd" data-id="${esc(i.id)}" data-val="-1">-</button>
          <span>${i.qtd}</span>
          <button class="btn2" data-act="qtd" data-id="${esc(i.id)}" data-val="1">+</button>
        </div>
        <button class="text-red-400 text-sm" data-act="remover" data-id="${esc(i.id)}">remover</button>
      </div>`).join('')}
    <p class="flex justify-between text-lg font-semibold mt-4"><span>Subtotal</span><span>${fmt(subtotal())}</span></p>
    <div class="flex gap-3 mt-5 flex-wrap">
      <button class="btn" data-act="checkout">Finalizar pedido</button>
      <button class="btn2" data-act="catalogo">Continuar comprando</button>
    </div>`);
}

function iniciarCheckout() {
  if (!sessao) {
    abrirLogin('entrar', 'Entre ou crie sua conta para finalizar o pedido e acompanhar seus pedidos.', abrirCheckout);
    return;
  }
  abrirCheckout();
}

const CIDADES_ENTREGA = ['Navegantes', 'Itajaí', 'Balneário Camboriú', 'Ilhota', 'Luiz Alves', 'Balneário Piçarras', 'Barra Velha', 'Penha'];
let sugestoesRua = [], ruaTimer = null, ruaReq = 0;
const semAcento = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function comporEndereco() {
  atualizarResumo();
  const rua = tira($('c-rua').value), num = tira($('c-num').value), bairro = tira($('c-bairro').value);
  const compl = tira($('c-compl').value), cid = $('c-cidade').value;
  if (!rua) return;
  let e = rua;
  if (num) e += ', ' + num;
  if (compl) e += ' - ' + compl;
  if (bairro) e += ' - ' + bairro;
  if (cid) e += ', ' + cid + ' - SC';
  $('c-end').value = e;
}

async function buscarRua() {
  const box = $('c-sug'); if (!box) return;
  const cidade = $('c-cidade').value, q = tira($('c-rua').value);
  if (!cidade || q.length < 3) { box.innerHTML = ''; return; }
  const req = ++ruaReq;
  box.innerHTML = '<p class="text-xs text-white/50 py-1">Buscando ruas…</p>';
  try {
    const r = await fetch('https://viacep.com.br/ws/SC/' + encodeURIComponent(semAcento(cidade)) + '/' + encodeURIComponent(semAcento(q)) + '/json/');
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    if (req !== ruaReq) return;
    const vistos = new Set(); sugestoesRua = [];
    (Array.isArray(d) ? d : []).forEach(x => {
      const k = x.logradouro + '|' + x.bairro;
      if (x.logradouro && !vistos.has(k)) { vistos.add(k); sugestoesRua.push(x); }
    });
    sugestoesRua = sugestoesRua.slice(0, 8);
    box.innerHTML = sugestoesRua.length
      ? sugestoesRua.map((x, i) => `<button type="button" data-act="sug-rua" data-i="${i}" class="w-full text-left px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 mb-1"><span class="font-medium">${esc(x.logradouro)}</span>${x.bairro ? `<span class="text-white/60 text-sm"> · ${esc(x.bairro)}</span>` : ''}</button>`).join('')
      : '<p class="text-xs text-white/50 py-1">Não achei essa rua na lista. Pode digitar o endereço mesmo assim.</p>';
  } catch (e) {
    if (req === ruaReq) box.innerHTML = '<p class="text-xs text-white/50 py-1">A busca de ruas não está disponível agora. Digite o endereço completo.</p>';
  }
}

function escolherRua(i) {
  const x = sugestoesRua[i]; if (!x) return;
  $('c-rua').value = x.logradouro;
  if (x.bairro) $('c-bairro').value = x.bairro;
  $('c-sug').innerHTML = '';
  comporEndereco();
  $('c-num').focus();
}

document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'c-rua') { clearTimeout(ruaTimer); ruaTimer = setTimeout(buscarRua, 450); comporEndereco(); }
  else if (id === 'c-num' || id === 'c-bairro' || id === 'c-compl') comporEndereco();
  else if (id === 'c-end') atualizarResumo();
  else if (id === 't-cidade') {
    const cid = CIDADES_ENTREGA.find(c => normTxt(c) === normTxt(e.target.value));
    const dl = $('t-bairros');
    if (dl) dl.innerHTML = bairrosDaCidade(cid || '').map(b => `<option value="${esc(b)}"></option>`).join('');
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'c-cidade') { buscarRua(); comporEndereco(); }
  else if (e.target.id === 'c-pag') atualizarResumo();
  else if (e.target.id === 'c-modo') alternarModo();
});

    <label>WhatsApp (com DDD)</label>

    ${config.retiradaAtiva ? `
    <label>Como você quer receber?</label>

      <option value="entrega">Entrega no meu endereço</option>
      <option value="retirada">Retirar no local</option>

    </select>
    <div id="c-troco-wrap" style="display:none">
      <label>Precisa de troco? Para quanto?</label>
      <input id="c-troco" inputmode="decimal" placeholder="Ex: 50,00">

    ${config.pix ? `<p class="text-sm text-white/70 mt-3">Chave PIX: ${esc(config.pix)}</p>` : ''}
    <div id="c-resumo" class="mt-4 text-white/70"></div>
    <div class="flex gap-3 mt-4 flex-wrap">
      <button class="btn" data-act="confirmar">Confirmar pedido</button>
      <button class="btn2" data-act="carrinho">Voltar</button>
    </div>`);
  atualizarResumo();

const modoRetirada = () => !!($('c-modo') && $('c-modo').value === 'retirada');
function alternarModo() {
  const r = modoRetirada();
  $('c-bloco-end').style.display = r ? 'none' : 'block';
  $('c-retirada').style.display = r ? 'block' : 'none';
  atualizarResumo();
}

function atualizarResumo() {
  const box = $('c-resumo'); if (!box) return;
  const cid = $('c-cidade') ? $('c-cidade').value : '';
  const bai = $('c-bairro') ? tira($('c-bairro').value) : '';
  const pag = $('c-pag') ? $('c-pag').value : 'pix';
  const retirada = modoRetirada();
  const textoEnd = $('c-end') ? tira($('c-end').value) : '';
  const achado = retirada ? null : acharFrete(textoEnd, cid, bai);
  const f = retirada ? 0 : (achado ? (Number(achado.valor) || 0) : null);
  const taxa = pag === 'cartao' ? (Number(config.taxaMaquininha) || 0) : 0;
  let h = '<p>Subtotal: ' + fmt(subtotal()) + '</p>';
  if (retirada) h += '<p>Retirada no local: sem frete</p>';
  else if (!bai && !textoEnd) h += '<p>Frete: informe cidade e bairro para calcular</p>';
  else if (f === null) h += '<p class="text-amber-300">Frete: a combinar. Avisaremos o valor pelo WhatsApp.</p>';
  else h += '<p>Frete: ' + fmt(f) + (achado ? ' (' + esc(achado.bairro) + ')' : '') + '</p>';
  if (taxa) h += '<p>Taxa da maquininha: ' + fmt(taxa) + '</p>';
  h += '<p class="text-white font-semibold">Total' + (f === null ? ' (sem o frete)' : '') + ': ' + fmt(subtotal() + (f || 0) + taxa) + '</p>';
  box.innerHTML = h;
}

async function confirmarPedido() {
  if (!sessao) { iniciarCheckout(); return; }

  const nome = tira($('c-nome').value);
  const whats = tira($('c-whats').value).replace(/\D/g, '');
  const retirada = !!config.retiradaAtiva && modoRetirada();
  const end = retirada ? 'RETIRADA NO LOCAL: ' + config.retiradaEndereco : tira($('c-end').value);
  const pag = $('c-pag').value;
  const trocoTxt = tira($('c-troco')?.value);

  if (!nome || !whats || !end) { alert('Preencha nome, WhatsApp e endereço.'); return; }
  if (!carrinho.length) { alert('Seu carrinho está vazio.'); return; }

  const taxa = pag === 'cartao' ? (Number(config.taxaMaquininha) || 0) : 0;
  const cidFrete = $('c-cidade').value, baiFrete = tira($('c-bairro').value);
  const achado = retirada ? null : acharFrete(end, cidFrete, baiFrete);
  const frete = retirada ? 0 : (achado ? (Number(achado.valor) || 0) : null);
  const freteCombinar = !retirada && frete === null;
  const localFrete = achado ? [achado.bairro, achado.cidade].join(', ') : [baiFrete, cidFrete].filter(Boolean).join(', ');
  const total = subtotal() + (frete || 0) + taxa;
  const t = Number(trocoTxt.replace(',', '.'));
  const troco = pag === 'dinheiro' && t > 0 ? t : null;
  const rotulo = { pix: 'PIX na entrega', cartao: 'Cartão na entrega', dinheiro: 'Dinheiro na entrega' }[pag];
  const itens = carrinho.map(i => `${i.qtd}x ${i.nome} (${fmt(i.preco * i.qtd)})`);
  const itensGuardados = carrinho.map(i => ({ id: i.id, qtd: i.qtd }));
  const linhaFrete = retirada
    ? 'Retirada no local (' + config.retiradaEndereco + ')'
    : freteCombinar
    ? 'Frete a combinar' + (localFrete ? ' (' + localFrete + ')' : '')
    : 'Frete: ' + fmt(frete) + ' (' + localFrete + ')';

  const win = window.open('', '_blank');
  const { data: ped, error } = await sb.from('gourmet_pedidos').insert({
    user_id: sessao.user.id,
    cliente_nome: nome,
    whatsapp: whats,
    endereco: end,
    itens: [...itens, linhaFrete],
    carrinho: itensGuardados,
    total,
    forma_pagamento: rotulo,
    troco
  }).select('numero').single();

  if (error) {
    if (win) win.close();
    console.error(error);
    alert('Erro ao enviar o pedido. Tente novamente.');
    return;
  }

  sb.auth.updateUser({ data: retirada ? { nome, whatsapp: whats } : { nome, whatsapp: whats, endereco: end } }).catch(() => {});

  let msg = '*Novo pedido*\n' + (ped && ped.numero ? '*' + numPedido(ped.numero) + '*\n' : '') + '\n' + itens.join('\n') + '\n\nSubtotal: ' + fmt(subtotal());
  msg += retirada ? '\nRetirada no local (sem frete)' : freteCombinar ? '\n*⚠ FRETE A COMBINAR*' + (localFrete ? ' (' + localFrete + ')' : '') : '\nFrete: ' + fmt(frete);
  if (taxa) msg += '\nTaxa da maquininha: ' + fmt(taxa);
  msg += '\n*Total' + (freteCombinar ? ' (sem o frete)' : '') + ': ' + fmt(total) + '*\n\nCliente: ' + nome + '\nWhatsApp: ' + whats + '\nConversar: ' + linkZap(whats) + (retirada ? '\n🏪 *RETIRADA NO LOCAL*: ' + config.retiradaEndereco : '\nEndereço: ' + end + '\nMapa: ' + linkMapa(end)) + '\nPagamento: ' + rotulo;
  if (troco) msg += '\nTroco para: ' + fmt(troco);

  const url = 'https://wa.me/' + config.whatsapp + '?text=' + encodeURIComponent(msg);
  if (win) win.location.href = url; else location.href = url;

  carrinho = [];
  atualizarContador();
  if (location.hash === '#conta') atualizarMeusPedidos();   // o pedido novo já aparece na lista
  modal(`
    <h2 class="serif text-3xl mb-2">Pedido ${ped && ped.numero ? esc(numPedido(ped.numero)) + ' ' : ''}enviado!</h2>
    <p class="text-white/70">Confirme o envio da mensagem no WhatsApp para a loja. Você também pode acompanhar o pedido em <b>Minha conta</b>.</p>
    <button class="btn mt-5" data-act="fechar">Fechar</button>`);
}

/* ---------- admin: login ---------- */
async function entrarAdmin() {
  const { data, error } = await sb.auth.signInWithPassword({
    email: tira($('l-email').value),
    password: $('l-senha').value
  });
  if (error) { $('l-erro').textContent = traduzErro(error); return; }
  if (!isAdminEmail(data.user?.email)) {
    await sb.auth.signOut();
    sessao = null;
    $('l-erro').textContent = 'Esta conta não tem acesso ao painel.';
    return;
  }
  sessao = data.session;
  renderAdmin();
}

/* ---------- admin: taxas (frete e maquininha) ---------- */
async function renderTaxas() {
  $('admin-conteudo').innerHTML = '<p class="text-white/60">Carregando...</p>';
  try {
    const { data, error } = await sb.from('gourmet_data').select('key,value').in('key', ['config', 'fretes']);
    if (error) throw error;
    (data || []).forEach(r => {
      if (r.key === 'config') config = { ...CONFIG_PADRAO, ...r.value };
      if (r.key === 'fretes') fretes = Array.isArray(r.value) ? r.value : [];
    });
  } catch (e) {
    $('admin-conteudo').innerHTML = '<p class="text-red-400">Erro ao carregar: ' + esc(e.message) + '</p>';
    return;
  }
  desenharTaxas();
}

function bairrosDaCidade(cidade) {
  const c = normTxt(cidade);
  const lista = fretes.filter(f => !c || normTxt(f.cidade) === c).map(f => f.bairro);
  return [...new Set(lista)].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function desenharTaxas() {
  const ed = freteEditId ? fretes.find(f => f.id === freteEditId) : null;
  const ordenado = [...fretes].sort((a, b) => a.cidade.localeCompare(b.cidade, 'pt-BR') || a.bairro.localeCompare(b.bairro, 'pt-BR'));
  $('admin-conteudo').innerHTML = `
  <div class="glass rounded-2xl p-5">
    <h2 class="text-xl font-semibold mb-1">Taxa da maquininha</h2>
    <p class="text-sm text-white/60">Valor somado ao pedido quando o cliente paga no cartão.</p>
    <label>Taxa da maquininha (R$)</label>
    <input id="t-maq" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(config.taxaMaquininha)}">
    <button class="btn mt-4" data-act="taxa-maq-salvar">Salvar taxa da maquininha</button>
  </div>

  <div class="glass rounded-2xl p-5 mt-4">
    <h2 class="text-xl font-semibold mb-1">Retirar no local</h2>
    <p class="text-sm text-white/60">Marcado: o cliente vê a opção "Retirar no local" ao finalizar o pedido (sem frete). Desmarcado: a opção não aparece.</p>
    <div class="flex items-center gap-3 mt-4">
      <input type="checkbox" id="t-ret-ativa" class="chk" ${config.retiradaAtiva ? 'checked' : ''}>
      <label for="t-ret-ativa" style="display:inline;margin:0;font-size:15px;color:#fff;cursor:pointer">Oferecer "Retirar no local" ao cliente</label>
    </div>
    <label>Endereço para retirada (você pode editar quando quiser)</label>
    <textarea id="t-ret-end" rows="2">${esc(config.retiradaEndereco)}</textarea>
    <button class="btn mt-4" data-act="retirada-salvar">Salvar retirada</button>
  </div>

  <div class="glass rounded-2xl p-5 mt-4">
    <h2 class="text-xl font-semibold mb-1">Frete por bairro</h2>
    <p class="text-sm text-white/60">Se o bairro do cliente não estiver na lista, o pedido sai com "frete a combinar" e aparece em destaque em Pedidos.</p>
    <label>Cidade</label>
    <input id="t-cidade" list="t-cidades" autocomplete="off" placeholder="Digite a primeira letra" value="${esc(ed ? ed.cidade : '')}">
    <datalist id="t-cidades">${CIDADES_ENTREGA.map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist>
    <label>Bairro</label>
    <input id="t-bairro" list="t-bairros" autocomplete="off" placeholder="Digite a primeira letra" value="${esc(ed ? ed.bairro : '')}">
    <datalist id="t-bairros">${bairrosDaCidade(ed ? ed.cidade : '').map(b => `<option value="${esc(b)}"></option>`).join('')}</datalist>
    <label>Valor do frete (R$)</label>
    <input id="t-valor" type="number" step="0.01" min="0" inputmode="decimal" value="${ed ? esc(ed.valor) : ''}">
    <div class="flex gap-2 mt-4 flex-wrap">
      <button class="btn" data-act="frete-salvar">${ed ? 'Salvar alteração' : 'Adicionar frete'}</button>
      ${ed ? '<button class="btn2" data-act="frete-cancelar">Cancelar edição</button>' : ''}
    </div>

    <h3 class="font-semibold mt-6 mb-2">Fretes cadastrados (${fretes.length})</h3>
    ${ordenado.length ? ordenado.map(f => `
      <div class="flex justify-between items-center gap-2 py-2 border-b border-white/10 text-sm flex-wrap">
        <span>${esc(f.cidade)} · ${esc(f.bairro)}</span>
        <span class="flex items-center gap-2 flex-wrap"><b>${fmt(f.valor)}</b>
          <button class="btn2" data-act="frete-editar" data-id="${esc(f.id)}">Editar</button>
          <button class="btn2" data-act="frete-excluir" data-id="${esc(f.id)}">Excluir</button>
        </span>
      </div>`).join('') : '<p class="text-white/60 text-sm">Nenhum frete cadastrado ainda. Enquanto a lista estiver vazia, todos os pedidos saem com "frete a combinar".</p>'}
  </div>`;
}

async function mesclarConfig(parte) {
  const { data, error } = await sb.from('gourmet_data').select('value').eq('key', 'config').maybeSingle();
  if (error) throw error;
  const nova = { ...CONFIG_PADRAO, ...((data && data.value) || {}), ...parte };
  await gravar('config', nova);
  config = nova;
}

async function salvarTaxaMaq() {
  const bruto = String($('t-maq').value).replace(',', '.');
  const v = Number(bruto);
  if (bruto === '' || !(v >= 0)) { alert('Digite o valor da taxa da maquininha.'); return; }
  try {
    await mesclarConfig({ taxaMaquininha: v });
    alert('Taxa da maquininha salva.');
  } catch (e) {
    alert('Erro ao salvar: ' + e.message);
  }
}

async function salvarRetirada() {
  const ativa = $('t-ret-ativa').checked;
  const end = tira($('t-ret-end').value);
  if (ativa && !end) { alert('Digite o endereço de retirada antes de ativar a opção.'); return; }
  try {
    await mesclarConfig({ retiradaAtiva: ativa, retiradaEndereco: end });
    alert(ativa ? 'Retirada no local salva e visível para o cliente.' : 'Retirada no local salva e escondida do cliente.');
  } catch (e) {
    alert('Erro ao salvar: ' + e.message);
  }
}

async function atualizarFretes(fn) {
  const { data, error } = await sb.from('gourmet_data').select('value').eq('key', 'fretes').maybeSingle();
  if (error) throw error;
  let lista = Array.isArray(data && data.value) ? data.value : [];
  lista = fn(lista) || lista;
  await gravar('fretes', lista);
  fretes = lista;
}

async function salvarFrete() {
  const cid = CIDADES_ENTREGA.find(c => normTxt(c) === normTxt($('t-cidade').value));
  const bai = tira($('t-bairro').value);
  const bruto = String($('t-valor').value).replace(',', '.');
  const v = Number(bruto);
  if (!cid) { alert('Escolha uma das cidades da lista: ' + CIDADES_ENTREGA.join(', ') + '.'); return; }
  if (!bai) { alert('Digite o bairro.'); return; }
  if (bruto === '' || !(v >= 0)) { alert('Digite o valor do frete.'); return; }
  const chave = x => normTxt(x.cidade) + '|' + normTxt(x.bairro);
  try {
    let atualizou = false;
    await atualizarFretes(lista => {
      const item = freteEditId ? lista.find(x => x.id === freteEditId) : null;
      const novo = { cidade: cid, bairro: bai };
      const dup = lista.find(x => chave(x) === chave(novo) && x !== item);
      if (item) {
        item.cidade = cid; item.bairro = bai; item.valor = v;
        if (dup) lista.splice(lista.indexOf(dup), 1);
      } else if (dup) {
        dup.valor = v; atualizou = true;
      } else {
        lista.push({ id: novoId(), cidade: cid, bairro: bai, valor: v });
      }
      return lista;
    });
    freteEditId = null;
    desenharTaxas();
    if (atualizou) alert('Esse bairro já existia. O valor foi atualizado.');
  } catch (e) {
    alert('Erro ao salvar: ' + e.message);
  }
}

async function excluirFrete(id) {
  if (!confirm('Excluir este frete?')) return;
  try {
    await atualizarFretes(lista => lista.filter(x => x.id !== id));
    if (freteEditId === id) freteEditId = null;
    desenharTaxas();
  } catch (e) {
    alert('Erro ao excluir: ' + e.message);
  }
}

  const periodos = [['1', 'Hoje'], ['0', 'Tudo']];
  $('admin-conteudo').innerHTML = `

          ${periodos.map(([k, n]) => `<button class="${relPeriodo === k ? 'btn' : 'btn2'}" data-act="rel-periodo" data-val="${k}">${n}</button>`).join('')}

        </div>
      </div>
      <div class="flex items-end gap-3 mb-4 flex-wrap">
        <div><label>De</label><input type="date" id="rel-ini" value="${esc(relIni)}" style="width:auto"></div>
        <div><label>Até</label><input type="date" id="rel-fim" value="${esc(relFim)}" style="width:auto"></div>
        <button class="${relPeriodo === 'datas' ? 'btn' : 'btn2'}" data-act="rel-datas">Filtrar período</button>
      </div>
      <div class="flex items-center gap-3 mb-4">
        <input type="checkbox" id="rel-frete" class="chk" data-act="rel-frete" ${relComFrete ? 'checked' : ''}>
        <label for="rel-frete" style="display:inline;margin:0;font-size:14px;color:#fff;cursor:pointer">Incluir o frete nos valores</label>
      </div>
      <div id="rel-corpo"><p class="text-white/60">Carregando...</p></div>
    </div>`;

  let q = sb.from('gourmet_pedidos').select('*').order('created_at', { ascending: false }).limit(2000);
  if (relPeriodo === 'datas') {
    if (relIni) q = q.gte('created_at', new Date(relIni + 'T00:00:00').toISOString());
    if (relFim) q = q.lte('created_at', new Date(relFim + 'T23:59:59.999').toISOString());
  } else if (relPeriodo !== '0') {
    const ini = new Date();
    ini.setHours(0, 0, 0, 0);
    ini.setDate(ini.getDate() - (Number(relPeriodo) - 1));
    q = q.gte('created_at', ini.toISOString());
  }
  const { data, error } = await q;
  if (error) {
    $('rel-corpo').innerHTML = `<p class="text-red-400">Erro ao carregar: ${esc(error.message)}</p>`;
    return;
  }

  const todos = data || [];
  const validos = todos.filter(p => p.status !== 'cancelado');
  const cancelados = todos.length - validos.length;
  const valorPed = p => (Number(p.total) || 0) - (relComFrete ? 0 : freteDoPedido(p));
  const faturamento = validos.reduce((t, p) => t + valorPed(p), 0);
  const ticket = validos.length ? faturamento / validos.length : 0;
  const freteTotal = validos.reduce((t, p) => t + freteDoPedido(p), 0);          // fretes cobrados nos pedidos válidos
  const freteCombinarQtd = validos.filter(ehFreteCombinar).length;               // fretes a combinar (valor não registrado)
  const fmtD = iso => String(iso).split('-').reverse().join('/');
  const rotuloPeriodo = relPeriodo === 'datas'
    ? (relIni ? fmtD(relIni) : 'início') + ' a ' + (relFim ? fmtD(relFim) : 'hoje')
    : (periodos.find(x => x[0] === relPeriodo) || [0, ''])[1];

  const prods = {};
  validos.forEach(p => (p.itens || []).forEach(linha => {
    const m = String(linha).match(/^(\d+)x (.+) \(R\$ ([\d.,]+)\)$/);
    if (!m) return;
    const nome = m[2];
    const valor = Number(m[3].replace(/\./g, '').replace(',', '.')) || 0;
    if (!prods[nome]) prods[nome] = { qtd: 0, valor: 0 };
    prods[nome].qtd += Number(m[1]);
    prods[nome].valor += valor;
  }));
  const topProds = Object.entries(prods).sort((a, b) => b[1].qtd - a[1].qtd).slice(0, 10);

  const pags = {};
  validos.forEach(p => {
    const k = p.forma_pagamento || 'Não informado';
    if (!pags[k]) pags[k] = { qtd: 0, valor: 0 };
    pags[k].qtd += 1;
    pags[k].valor += valorPed(p);
  });
  const listaPags = Object.entries(pags).sort((a, b) => b[1].qtd - a[1].qtd);

  const clientes = {};
  validos.forEach(p => {
    const k = p.user_id || p.whatsapp;
    if (!clientes[k]) clientes[k] = { nome: p.cliente_nome, whatsapp: p.whatsapp, qtd: 0, valor: 0 };
    clientes[k].qtd += 1;
    clientes[k].valor += valorPed(p);
  });
  const topClientes = Object.values(clientes).sort((a, b) => b.valor - a.valor).slice(0, 10);

  relDados = {
    comFrete: relComFrete,
    periodo: rotuloPeriodo,
    faturamento, pedidos: validos.length, cancelados, ticket, freteTotal, freteCombinarQtd, topProds, listaPags, topClientes
  };

  const linha = (esq, dir) => `<div class="flex justify-between gap-3 py-2 border-b border-white/10 text-sm"><span>${esq}</span><span class="text-white/80 text-right">${dir}</span></div>`;
  const vazio = '<p class="text-white/60 text-sm">Sem dados neste período.</p>';

  $('rel-corpo').innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
      <div class="border border-white/15 rounded-xl p-4"><p class="text-white/60 text-sm">Faturamento</p><p class="text-2xl font-semibold">${fmt(faturamento)}</p></div>
      <div class="border border-white/15 rounded-xl p-4"><p class="text-white/60 text-sm">Pedidos</p><p class="text-2xl font-semibold">${validos.length}</p>${cancelados ? `<p class="text-white/50 text-xs">+ ${cancelados} cancelado(s), fora das contas</p>` : ''}</div>
      <div class="border border-white/15 rounded-xl p-4"><p class="text-white/60 text-sm">Ticket médio</p><p class="text-2xl font-semibold">${fmt(ticket)}</p></div>
      <div class="border border-white/15 rounded-xl p-4"><p class="text-white/60 text-sm">Fretes arrecadados</p><p class="text-2xl font-semibold">${fmt(freteTotal)}</p>${freteCombinarQtd ? `<p class="text-white/50 text-xs">+ ${freteCombinarQtd} pedido(s) com frete a combinar (valor não contado)</p>` : ''}</div>
    </div>

    <h3 class="font-semibold mb-2">Produtos mais vendidos</h3>
    <div class="mb-6">${topProds.length ? topProds.map(([n, d], i) => linha((i + 1) + '. ' + esc(n), d.qtd + ' un. · ' + fmt(d.valor))).join('') : vazio}</div>

    <h3 class="font-semibold mb-2">Formas de pagamento</h3>
    <div class="mb-6">${listaPags.length ? listaPags.map(([n, d]) => linha(esc(n), d.qtd + ' pedido(s) · ' + fmt(d.valor))).join('') : vazio}</div>

    <h3 class="font-semibold mb-2">Clientes que mais compram</h3>
    <div>${topClientes.length ? topClientes.map((c, i) => linha((i + 1) + '. ' + esc(c.nome) + ' · <a href="' + linkZap(c.whatsapp) + '" target="_blank" rel="noopener" class="underline">' + esc(c.whatsapp) + '</a>', c.qtd + ' pedido(s) · ' + fmt(c.valor))).join('') : vazio}</div>`;
}

function baixarRelatorio() {

  const L = [];
  L.push([c('Relatório - ' + d.periodo)].join(';'));
  L.push([c('Frete incluído nos valores'), c(d.comFrete ? 'sim' : 'não')].join(';'));
  L.push('');
  L.push([c('Faturamento (R$)'), n(d.faturamento)].join(';'));
  L.push([c('Pedidos'), d.pedidos].join(';'));
  L.push([c('Pedidos cancelados (fora das contas)'), d.cancelados].join(';'));
  L.push([c('Ticket médio (R$)'), n(d.ticket)].join(';'));
  L.push([c('Fretes arrecadados (R$)'), n(d.freteTotal)].join(';'));
  L.push([c('Pedidos com frete a combinar (valor não contado)'), d.freteCombinarQtd].join(';'));
  L.push('');
  L.push([c('Produtos mais vendidos'), c('Quantidade'), c('Valor (R$)')].join(';'));
  d.topProds.forEach(([nome, x]) => L.push([c(nome), x.qtd, n(x.valor)].join(';')));
  L.push('');
  L.push([c('Formas de pagamento'), c('Pedidos'), c('Valor (R$)')].join(';'));
  d.listaPags.forEach(([nome, x]) => L.push([c(nome), x.qtd, n(x.valor)].join(';')));
  L.push('');
  L.push([c('Clientes que mais compram'), c('WhatsApp'), c('Pedidos'), c('Valor (R$)')].join(';'));
  d.topClientes.forEach(x => L.push([c(x.nome), c(x.whatsapp), x.qtd, n(x.valor)].join(';')));

  const blob = new Blob(['\ufeff' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' });

  a.href = URL.createObjectURL(blob);

  setTimeout(() => URL.revokeObjectURL(a.href), 2000);

  if (canal) return;
  canal = sb.channel('gourmet-pedidos')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'gourmet_pedidos' }, payload => {

/* ---------- sons ---------- */
let audioCtx = null;
function audio() {
  try {
    if (!audioCtx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      audioCtx = new C();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, audio, { once: true, passive: true }));

function nota(freq, inicio, dur, vol, tipo) {
  const ctx = audio(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo || 'sine';
  o.frequency.value = freq;
  o.connect(g); g.connect(ctx.destination);
  const t = ctx.currentTime + inicio;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}

// admin: duas notas subindo (ding-dong), mais chamativo
function tocar() {
  try {
    nota(784, 0, 0.3, 0.35, 'triangle');
    nota(1047, 0.28, 0.5, 0.35, 'triangle');
  } catch (e) {}
}

function tocarSuave() {
  try {
    nota(659, 0, 0.5, 0.12, 'sine');

  } catch (e) {}
}

/* ---------- push: avisos com o site fechado ---------- */
const VAPID_PUBLIC = 'BDbNfsOnrIi24AqJ20_gjc5EKiaTmohTXhoLfnA2-YOVQrJSU-xbOX7haKpHYjKrJBCQyU6UDIyxmVWiAVOdY9I';
const b64ParaU8 = b64 => {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
};
const pushSuportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const modoApp = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const ehIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

async function salvarAssinatura(sub) {
  const j = sub.toJSON();
  const { error } = await sb.rpc('salvar_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) throw error;
}

async function ativarPush() {
  if (!sessao) { abrirLogin('entrar', 'Entre na sua conta para ativar os avisos de pedido.'); return; }
  if (ehIOS() && !modoApp()) {
    modal(`
      <h2 class="serif text-3xl mb-3">Avisos no iPhone</h2>
      <p class="text-white/70">No iPhone, os avisos só funcionam se o site estiver na tela inicial:</p>
      <ol class="text-white/80 mt-3 space-y-1 list-decimal list-inside">
        <li>Abra este site no <b>Safari</b>.</li>
        <li>Toque no botão de <b>compartilhar</b> (quadrado com seta).</li>
        <li>Toque em <b>Adicionar à Tela de Início</b>.</li>
        <li>Abra o site pelo <b>ícone novo</b> e toque de novo em "Ativar avisos de pedido".</li>
      </ol>
      <button class="btn mt-5" data-act="fechar">Entendi</button>`);
    return;
  }
  if (!pushSuportado()) { alert('Este navegador não consegue receber avisos com o site fechado.'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert('Os avisos não foram permitidos. Libere nas configurações do navegador.'); return; }
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ParaU8(VAPID_PUBLIC) });
    await salvarAssinatura(sub);
    alert('Avisos ativados! Você será avisado mesmo com o site fechado.');
  } catch (e) {
    console.warn(e);
    alert('Não foi possível ativar os avisos agora. Tente de novo.');
  }
}

// religa o aparelho à conta atual (ex.: depois de entrar de novo)
async function religarPush() {
  try {
    if (!sessao || !pushSuportado() || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) await salvarAssinatura(sub);
  } catch (e) { console.warn(e); }
}

async function soltarPush() {
  try {
    if (!pushSuportado()) return;
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) await sb.rpc('remover_push', { p_endpoint: sub.endpoint });
  } catch (e) { console.warn(e); }
}

// ao tocar na notificação, o aparelho abre o site na tela certa sem recarregar
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.url) {
      try { location.hash = new URL(e.data.url, location.origin).hash || ''; } catch (_) {}
    }
  });
}

}

async function reduzirFoto(file, largura = 800) {
  const img = await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não foi possível ler esta imagem. Tente outra foto (JPG ou PNG).')); };
    im.src = url;
  });
  const escala = Math.min(1, largura / img.width);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * escala);
  canvas.height = Math.round(img.height * escala);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

  // Safari antigo não gera WebP no canvas; nesse caso usa JPEG
  let blob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.8));
  let ext = 'webp';
  if (!blob || blob.type !== 'image/webp') {
    blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
    ext = 'jpg';
  }
  if (!blob) throw new Error('Falha ao preparar a imagem.');
  return { blob, ext };
}

async function enviarFoto(file) {
  const { blob, ext } = await reduzirFoto(file);
  const caminho = 'produtos/' + novoId() + '.' + ext;
  const { error } = await sb.storage.from('fotos').upload(caminho, blob, {
    contentType: blob.type,
    cacheControl: '31536000'
  });
  if (error) throw error;
  const { data } = sb.storage.from('fotos').getPublicUrl(caminho);
  return data.publicUrl;
}

async function salvarProduto() {
  const nome = tira($('p-nome').value);
  if (!nome) { alert('Informe o nome do produto.'); return; }

  let foto = tira($('p-foto').value);
  const arquivo = $('p-foto-arquivo').files[0];
  if (arquivo) {
    try {
      $('p-foto-status').textContent = 'Enviando foto...';
      foto = await enviarFoto(arquivo);
    } catch (e) {
      $('p-foto-status').textContent = '';
      alert('Erro ao enviar a foto: ' + (e.message || e));
      return;
    }
  }

  const dados = {
    nome,
    descricao: $('p-desc').value,
    preco: Number($('p-preco').value) || 0,
    categoria: $('p-cat').value,
    foto,
    ativo: $('p-ativo').checked
  };
  if (prodEditando && prodEditando.id) {
    Object.assign(produtos.find(p => p.id === prodEditando.id), dados);
  } else {
    produtos.push({ id: novoId(), ...dados });
  }
  try {
    await gravar('produtos', produtos);
    prodEditando = null;
    renderProdutos();
  } catch (e) {
    alert('Erro ao salvar: ' + e.message);
  }
}

/* ---------- cliques (delegação) ---------- */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.val, id = el.dataset.id;

  if (a === 'catalogo') abrirCatalogo(v || null);
  else if (a === 'ver') verProduto(id);
  else if (a === 'add') addCarrinho(id, Number($('qtd-prod').value || 1));
  else if (a === 'carrinho') abrirCarrinho();
  else if (a === 'qtd') alterarQtd(id, Number(v));
  else if (a === 'remover') { carrinho = carrinho.filter(i => i.id !== id); abrirCarrinho(); }
  else if (a === 'checkout') iniciarCheckout();
  else if (a === 'confirmar') confirmarPedido();
  else if (a === 'sug-rua') escolherRua(Number(el.dataset.i));
  else if (a === 'fechar') fecharModal();

  else if (a === 'login-abrir') abrirLogin('entrar');
  else if (a === 'cadastro-abrir') abrirLogin('cadastro');
  else if (a === 'login-tab') abrirLogin(v);
  else if (a === 'esqueci-abrir') abrirEsqueci();
  else if (a === 'esqueci-enviar') enviarEsqueci();
  else if (a === 'nova-senha-salvar') salvarNovaSenha();
  else if (a === 'entrar-enviar') entrarCliente();
  else if (a === 'cadastro-enviar') cadastrarCliente();
  else if (a === 'reorder') reorderPedido(id);
  else if (a === 'cancelar-meu') cancelarMeuPedido(id);
  else if (a === 'sair') sair();
  else if (a === 'toggle-senha') {
    const inp = el.parentElement.querySelector('input');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    el.textContent = inp.type === 'password' ? 'Mostrar' : 'Ocultar';
  }

  else if (a === 'admin-login') entrarAdmin();
  else if (a === 'rel-baixar') baixarRelatorio();
  else if (a === 'rel-periodo') { relPeriodo = v; renderRelatorios(); }
  else if (a === 'rel-datas') {
    const ini = $('rel-ini') ? $('rel-ini').value : '', fim = $('rel-fim') ? $('rel-fim').value : '';
    if (!ini && !fim) { alert('Escolha pelo menos uma data (De ou Até).'); return; }
    if (ini && fim && ini > fim) { alert('A data "De" não pode ser depois da data "Até".'); return; }
    relIni = ini; relFim = fim; relPeriodo = 'datas';
    renderRelatorios();
  }
  else if (a === 'admin-tab') { adminTab = v; prodEditando = null; freteEditId = null; renderAdmin(); }
  else if (a === 'taxa-maq-salvar') salvarTaxaMaq();
  else if (a === 'retirada-salvar') salvarRetirada();
  else if (a === 'suporte') abrirSuporte();
  else if (a === 'rel-frete') { relComFrete = !relComFrete; renderRelatorios(); }
  else if (a === 'frete-salvar') salvarFrete();
  else if (a === 'frete-editar') { freteEditId = id; desenharTaxas(); $('t-cidade').scrollIntoView({ block: 'center' }); }
  else if (a === 'frete-cancelar') { freteEditId = null; desenharTaxas(); }
  else if (a === 'frete-excluir') excluirFrete(id);
  else if (a === 'status') mudarStatus(id, v);
  else if (a === 'notif') ativarNotificacoes();
  else if (a === 'push-ativar') ativarPush();
  else if (a === 'config-salvar') salvarConfig();
  else if (a === 'prod-novo') { prodEditando = { id: null }; renderAdmin(); }
  else if (a === 'prod-editar') { prodEditando = produtos.find(p => p.id === id) || null; renderAdmin(); }
  else if (a === 'prod-cancelar') { prodEditando = null; renderAdmin(); }
  else if (a === 'prod-salvar') salvarProduto();
  else if (a === 'prod-ativo') {
    const p = produtos.find(x => x.id === id);
    if (p) {
      p.ativo = p.ativo === false;
      try { await gravar('produtos', produtos); } catch (err) { alert(err.message); }
      renderAdmin();
    }
  }
  else if (a === 'prod-excluir') {
    if (!confirm('Excluir este produto?')) return;
    produtos = produtos.filter(p => p.id !== id);
    try { await gravar('produtos', produtos); } catch (err) { alert(err.message); }
    renderAdmin();
  }
});

iniciar();
</script>
